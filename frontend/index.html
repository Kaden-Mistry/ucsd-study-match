<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCSD Study & Project Match</title>
<style>
  :root {
    --navy: #182B49; --gold: #C69214; --bg: #F7F7F5; --card: #FFFFFF;
    --text: #1A1A1A; --muted: #6B6B6B; --border: #E5E5E0; --green: #2E7D4F;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); }
  header { background: var(--navy); padding: 24px 20px; text-align: center; }
  header h1 { color: white; margin: 0 0 4px; font-size: 20px; }
  header p { color: #C9D2E0; margin: 0; font-size: 13px; }
  main { max-width: 560px; margin: 24px auto; padding: 0 20px 60px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  input, select, textarea, button {
    font-family: inherit; font-size: 15px; padding: 11px 14px; border-radius: 8px;
    border: 1px solid var(--border); width: 100%; box-sizing: border-box; outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--gold); }
  textarea { resize: vertical; min-height: 60px; }
  label { font-size: 13px; color: var(--muted); display: block; margin: 12px 0 4px; }
  label:first-child { margin-top: 0; }
  button.primary { background: var(--navy); color: white; border: none; margin-top: 16px; cursor: pointer; font-weight: 600; }
  button.primary:hover { opacity: 0.92; }
  button.secondary { background: white; color: var(--navy); border: 1px solid var(--navy); margin-top: 8px; cursor: pointer; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .posting { border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-top: 10px; }
  .posting-top { display: flex; justify-content: space-between; align-items: center; }
  .posting-name { font-weight: 600; }
  .badge { font-size: 11px; padding: 2px 9px; border-radius: 12px; font-weight: 600; }
  .badge.study { background: #E8F0FA; color: #1D5A9C; }
  .badge.project { background: #FBEEE0; color: #A85D1E; }
  .badge.both { background: #EEF2E9; color: var(--green); }
  .posting-note { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .msg-box { display: none; margin-top: 10px; }
  .msg-box.open { display: block; }
  .error { color: #B3411E; font-size: 13px; margin-top: 8px; }
  .success { color: var(--green); font-size: 13px; margin-top: 8px; }
  .muted-note { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .hidden { display: none; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .signout { color: var(--muted); font-size: 12px; cursor: pointer; }
</style>
</head>
<body>

<header>
  <h1>Study & Project Match</h1>
  <p>UCSD students only — verified by .edu email</p>
</header>

<main id="app"></main>

<!-- Firebase Authentication (compat build — no bundler in this project) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<script>
// Point this at wherever you're running the backend
const API_BASE = "https://ucsd-study-match-production.up.railway.app";

// From the Firebase console: Project settings -> General -> "Your apps" ->
// Web app -> SDK setup and configuration. These values are public (they're
// shipped to every browser) — the actual security boundary is the backend's
// FIREBASE_PROJECT_ID check in /api/auth/google, not secrecy of this object.
// Also required in the Firebase console:
//   1. Authentication -> Sign-in method -> enable "Google"
//   2. Authentication -> Settings -> Authorized domains -> add whatever
//      domain this file is served from (localhost is included by default,
//      but opening this file directly as file:// will NOT work — serve it,
//      e.g. `python3 -m http.server`, during local dev).
const firebaseConfig = {
  apiKey: "AIzaSyBwCXWrYIhklVWQjkiFFXTPRFFO4lvfOBk",
  authDomain: "ucsdstudymatch-3445e.firebaseapp.com",
  projectId: "ucsdstudymatch-3445e",
  storageBucket: "ucsdstudymatch-3445e.firebasestorage.app",
  messagingSenderId: "540861297060",
  appId: "1:540861297060:web:defc3136147a5039095131",
};
firebase.initializeApp(firebaseConfig);

// Persisted in localStorage (not just an in-memory variable) so a page
// refresh doesn't log the user out — init() below re-validates it against
// the backend on load and clears it if it's no longer good.
let sessionToken = localStorage.getItem("session_token");
let currentUserName = localStorage.getItem("display_name");

function render() {
  const app = document.getElementById("app");
  if (!sessionToken) {
    app.innerHTML = renderAuthCard();
  } else {
    app.innerHTML = renderMainApp();
    document.getElementById("browse-form").addEventListener("submit", onBrowse);
    document.getElementById("post-form").addEventListener("submit", onCreatePosting);
  }
}

async function init() {
  if (sessionToken) {
    try {
      const res = await fetch(`${API_BASE}/api/me`, {
        headers: { Authorization: `Bearer ${sessionToken}` },
      });
      if (!res.ok) throw new Error("stale session");
      const data = await res.json();
      currentUserName = data.display_name || data.email.split("@")[0];
      localStorage.setItem("display_name", currentUserName);
    } catch {
      clearSession();
    }
  }
  render();
}

// ---------- Auth ----------

function renderAuthCard() {
  return `
    <div class="card">
      <p style="margin-top:0;color:var(--muted);font-size:13px">
        Sign in with your UCSD Google account to continue. Only @ucsd.edu
        accounts can sign in.
      </p>
      <button class="primary" onclick="doGoogleSignIn()">Sign in with Google</button>
      <div id="auth-msg"></div>
    </div>
  `;
}

async function doGoogleSignIn() {
  const msgEl = document.getElementById("auth-msg");
  msgEl.innerHTML = "";
  const provider = new firebase.auth.GoogleAuthProvider();
  // Hints Google's account picker toward ucsd.edu accounts — a UX nicety
  // only, not enforcement (a user could still pick another account, so the
  // backend independently checks the email domain on every sign-in).
  provider.setCustomParameters({ hd: "ucsd.edu" });

  try {
    const result = await firebase.auth().signInWithPopup(provider);
    const idToken = await result.user.getIdToken();

    const res = await fetch(`${API_BASE}/api/auth/google`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id_token: idToken }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Sign-in failed");

    sessionToken = data.session_token;
    currentUserName = data.display_name;
    localStorage.setItem("session_token", sessionToken);
    localStorage.setItem("display_name", currentUserName);
    render();
  } catch (err) {
    if (err.code !== "auth/popup-closed-by-user") {
      msgEl.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
    }
    firebase.auth().signOut().catch(() => {});
  }
}

function clearSession() {
  sessionToken = null;
  currentUserName = null;
  localStorage.removeItem("session_token");
  localStorage.removeItem("display_name");
}

function signOut() {
  clearSession();
  firebase.auth().signOut().catch(() => {});
  render();
}

// ---------- Main app ----------

function renderMainApp() {
  return `
    <div class="top-bar">
      <div style="font-size:13px;color:var(--muted)">Signed in as <b>${escapeHtml(currentUserName)}</b></div>
      <div class="signout" onclick="signOut()">Sign out</div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Find a partner</h3>
      <form id="browse-form">
        <div class="row">
          <div><label>Subject</label><input id="browse-subject" placeholder="CSE" required></div>
          <div><label>Course #</label><input id="browse-num" placeholder="100" required></div>
        </div>
        <label>Looking for</label>
        <select id="browse-pref">
          <option value="">Anyone</option>
          <option value="study">Study partner</option>
          <option value="project">Project partner</option>
        </select>
        <button class="primary" type="submit">Search</button>
      </form>
      <div id="browse-results"></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0">Post that you're looking for a partner</h3>
      <form id="post-form">
        <div class="row">
          <div><label>Subject</label><input id="post-subject" placeholder="CSE" required></div>
          <div><label>Course #</label><input id="post-num" placeholder="100" required></div>
        </div>
        <label>I'm looking for</label>
        <select id="post-pref">
          <option value="study">Study partner</option>
          <option value="project">Project partner</option>
          <option value="both">Either</option>
        </select>
        <label>Note (optional)</label>
        <textarea id="post-note" placeholder="e.g. want to review before the midterm, free evenings"></textarea>
        <button class="primary" type="submit">Post</button>
        <div id="post-msg"></div>
      </form>
    </div>
  `;
}

async function onBrowse(e) {
  e.preventDefault();
  const subject = document.getElementById("browse-subject").value.trim();
  const num = document.getElementById("browse-num").value.trim();
  const pref = document.getElementById("browse-pref").value;
  const resultsEl = document.getElementById("browse-results");
  resultsEl.innerHTML = `<div class="muted-note">Searching…</div>`;

  try {
    let url = `${API_BASE}/api/postings?subject=${encodeURIComponent(subject)}&catalog_number=${encodeURIComponent(num)}`;
    if (pref) url += `&preference=${pref}`;
    const res = await fetch(url, { headers: { Authorization: `Bearer ${sessionToken}` } });
    const postings = await res.json();
    if (!res.ok) throw new Error(postings.detail || "Search failed");

    if (postings.length === 0) {
      resultsEl.innerHTML = `<div class="muted-note">No one's posted for this course yet — be the first below.</div>`;
      return;
    }
    resultsEl.innerHTML = postings.map(p => `
      <div class="posting">
        <div class="posting-top">
          <span class="posting-name">${escapeHtml(p.display_name || "A student")}</span>
          <span class="badge ${p.preference}">${p.preference}</span>
        </div>
        ${p.note ? `<div class="posting-note">${escapeHtml(p.note)}</div>` : ""}
        <button class="secondary" onclick="toggleMsgBox(${p.posting_id})">Message</button>
        <div class="msg-box" id="msgbox-${p.posting_id}">
          <textarea id="msgtext-${p.posting_id}" placeholder="Say hi and suggest a time to meet"></textarea>
          <button class="primary" onclick="sendMsg(${p.posting_id})">Send</button>
          <div id="msgresult-${p.posting_id}"></div>
        </div>
      </div>
    `).join("");
  } catch (err) {
    resultsEl.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
  }
}

function toggleMsgBox(postingId) {
  document.getElementById(`msgbox-${postingId}`).classList.toggle("open");
}

async function sendMsg(postingId) {
  const body = document.getElementById(`msgtext-${postingId}`).value.trim();
  const resultEl = document.getElementById(`msgresult-${postingId}`);
  if (!body) return;
  try {
    const res = await fetch(`${API_BASE}/api/messages`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${sessionToken}` },
      body: JSON.stringify({ posting_id: postingId, body }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Failed to send");
    resultEl.innerHTML = `<div class="success">Sent!</div>`;
  } catch (err) {
    resultEl.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
  }
}

async function onCreatePosting(e) {
  e.preventDefault();
  const subject = document.getElementById("post-subject").value.trim();
  const num = document.getElementById("post-num").value.trim();
  const preference = document.getElementById("post-pref").value;
  const note = document.getElementById("post-note").value.trim();
  const msgEl = document.getElementById("post-msg");

  try {
    const res = await fetch(`${API_BASE}/api/postings`, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${sessionToken}` },
      body: JSON.stringify({ subject, catalog_number: num, preference, note: note || null }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || "Failed to post");
    msgEl.innerHTML = `<div class="success">Posted! Other students in ${escapeHtml(subject)} ${escapeHtml(num)} can now find you.</div>`;
  } catch (err) {
    msgEl.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
  }
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str ?? "";
  return div.innerHTML;
}

init();
</script>

</body>
</html>
